name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nfc-insta-apk
          path: app/build/outputs/apk/release/*.apk
      # Publica el APK como release para poder descargarlo directo desde el móvil
      - run: cp app/build/outputs/apk/release/*.apk nfc-insta.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }} (${{ github.ref_name }})"
          prerelease: true
          files: nfc-insta.apk
